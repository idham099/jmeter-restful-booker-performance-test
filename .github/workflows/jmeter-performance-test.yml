name: JMeter Performance Testing CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Extract JMeter
        run: |
          curl -sO https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Locate JMX & Execute Test
        run: |
          # Hapus file hasil lama jika terikut dari repo
          rm -f result.jtl
          rm -rf github_report
          
          # Cari file .jmx secara otomatis
          JMX_FILE=$(ls *.jmx | head -n 1)
          echo "Found Test Plan: $JMX_FILE"
          
          # Jalankan JMeter
          ./apache-jmeter-5.6.3/bin/jmeter -n -t "$JMX_FILE" -l result.jtl -e -o github_report

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: github_report/
