name: JMeter Performance Testing CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run JMeter Test Plan
        uses: rbhadti/jmeter-action@v1.0.0
        with:
          testFilePath: 'restful_booker_crud.jmx'
          args: '-l result.jtl -e -o github_report'

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: github_report/
