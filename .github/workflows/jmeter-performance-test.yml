name: JMeter Performance Testing CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup JMeter
        uses: kulya/setup-jmeter@v5.1
        with:
          jmeter-version: '5.6.3'

      - name: Run JMeter Test & Generate HTML Report
        run: |
          jmeter -n -t restful_booker_crud.jmx -l result.jtl -e -o github_report

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: github_report/
